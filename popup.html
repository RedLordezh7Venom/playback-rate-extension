<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Speed Reset</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      width: 200px;
    }
    button {
      padding: 10px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="reset-speed">Reset Speed to 1x</button>
  <hr>
  <button id="toggle-side-panel">Toggle Side Panel</button>
  <hr>
  <button id="view-saved">View Saved Videos</button>
  <div id="saved-videos-list" style="margin-top: 10px;"></div>
  <script src="popup.js"></script>
</body>
</html>
