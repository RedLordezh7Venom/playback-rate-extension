<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tools</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <div class="side-panel-container">
        <h1>Video Tools</h1>
        <div id="panel-content">
            <h3>Video Filters</h3>
            <div id="filter-buttons"></div>
            <hr>
            <h3>Audio Equalizer</h3>
            <div id="equalizer-controls">
                <div>
                    <label for="bass">Bass</label>
                    <input type="range" id="bass" min="-10" max="10" value="0" step="1">
                </div>
                <div>
                    <label for="treble">Treble</label>
                    <input type="range" id="treble" min="-10" max="10" value="0" step="1">
                </div>
                <div>
                    <label for="balance">Balance</label>
                    <input type="range" id="balance" min="-1" max="1" value="0" step="0.1">
                </div>
            </div>
        </div>
    </div>
    <script src="sidepanel.js"></script>
</body>
</html>
