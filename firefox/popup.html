<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      font-family: Arial, sans-serif;
      padding: 15px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
      font-size: 18px;
      margin-top: 0;
    }
    .controls {
      background: white;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    button {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #0056b3;
    }
    .rate-display {
      text-align: center;
      margin: 10px 0;
      font-size: 16px;
      font-weight: bold;
      color: #333;
    }
    .shortcuts {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid #ddd;
      font-size: 12px;
      color: #666;
    }
    .shortcut-item {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h1>Playback Speed Control</h1>
  <div class="controls">
    <div class="rate-display">Speed: <span id="rate">1.0</span>x</div>
    <button id="decrease">Decrease Speed (,)</button>
    <button id="reset">Reset Speed (=)</button>
    <button id="increase">Increase Speed (.)</button>
  </div>
  <div class="shortcuts">
    <strong>Keyboard Shortcuts:</strong>
    <div class="shortcut-item">, or &lt; : Decrease speed by 0.25x</div>
    <div class="shortcut-item">= or + : Reset to 1.0x</div>
    <div class="shortcut-item">. or &gt; : Increase speed by 0.25x</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
